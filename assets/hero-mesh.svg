<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <!-- Stress distribution gradients -->
    <linearGradient id="stressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#EAB308" stop-opacity="0.5"/>
      <stop offset="95%" stop-color="#EF4444" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" stroke="#1E293B" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Technical grid background -->
  <rect width="640" height="480" fill="#0B1320" rx="8"/>
  <rect width="640" height="480" fill="url(#isoGrid)" opacity="0.6"/>

  <!-- Technical Drawing Border & Corner Crosshairs -->
  <rect x="16" y="16" width="608" height="448" stroke="#334155" stroke-width="1" stroke-dasharray="8 4" fill="none"/>
  <!-- Corner ticks -->
  <path d="M 12 16 L 24 16 M 16 12 L 16 24" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 616 16 L 628 16 M 624 12 L 624 24" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 12 464 L 24 464 M 16 456 L 16 468" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 616 464 L 628 464 M 624 456 L 624 468" stroke="#64748B" stroke-width="1.5"/>

  <!-- Technical Header in Diagram -->
  <text x="32" y="44" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1">FEA STRUCTURAL EVALUATION // MODEL VALIDATION [REF-01]</text>
  <text x="500" y="44" fill="#38BDF8" font-family="monospace" font-size="11">SCALE: 1:1 [NORM]</text>
  <line x1="32" y1="52" x2="608" y2="52" stroke="#1E293B" stroke-width="1"/>

  <!-- Structural Bracket 3D Isometric Finite Element Mesh -->
  <g transform="translate(40, 20)">
    <!-- Base Mounting Flange Elements -->
    <polygon points="120,300 240,360 400,280 280,220" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="120,300 120,320 240,380 240,360" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="240,360 240,380 400,300 400,280" fill="#141E33" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Upright Rib / Structural Web Elements with FEA Stress Gradient -->
    <polygon points="220,130 300,90 300,210 220,250" fill="url(#stressGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="180,150 220,130 220,250 180,270" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Top Pin / Bearing Lug -->
    <polygon points="220,130 260,110 300,130 260,150" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="260" cy="130" rx="18" ry="10" fill="#0B1320" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Finite Element Mesh Discretization Lines -->
    <!-- Base Plate Sub-elements -->
    <line x1="160" y1="320" x2="320" y2="240" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="200" y1="340" x2="360" y2="260" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="180" y1="270" x2="240" y2="360" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="240" y1="240" x2="320" y2="320" stroke="#0284C7" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Upright Rib Sub-elements (High Stress Concentration Zone) -->
    <line x1="220" y1="170" x2="300" y2="130" stroke="#38BDF8" stroke-width="1"/>
    <line x1="220" y1="210" x2="300" y2="170" stroke="#38BDF8" stroke-width="1"/>
    <line x1="260" y1="110" x2="260" y2="230" stroke="#38BDF8" stroke-width="1"/>

    <!-- High Stress Node Callout (Von Mises Peak) -->
    <circle cx="260" cy="190" r="4" fill="#EF4444"/>
    <circle cx="260" cy="190" r="10" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="260" y1="190" x2="360" y2="150" stroke="#EF4444" stroke-width="1.25"/>
    <line x1="360" y1="150" x2="440" y2="150" stroke="#EF4444" stroke-width="1.25"/>
    <rect x="445" y="138" width="105" height="24" rx="3" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="453" y="154" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="bold">σ_max: CRITICAL</text>

    <!-- Boundary Condition: Fixed Constraint Symbols on Bolt Holes -->
    <!-- Bolt Hole 1 -->
    <ellipse cx="170" cy="335" rx="10" ry="6" fill="#0B1320" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M 165 343 L 175 343 M 167 346 L 173 346" stroke="#94A3B8" stroke-width="1.2"/>
    <!-- Bolt Hole 2 -->
    <ellipse cx="330" cy="275" rx="10" ry="6" fill="#0B1320" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M 325 283 L 335 283 M 327 286 L 333 286" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Load Vector Arrow at Pin Hole -->
    <path d="M 260 70 L 260 115" stroke="#F59E0B" stroke-width="2.5"/>
    <polygon points="255,115 265,115 260,125" fill="#F59E0B"/>
    <text x="270" y="85" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="bold">F_ext: 12.5 kN</text>

    <!-- Mesh Nodes Points -->
    <circle cx="120" cy="300" r="2.5" fill="#38BDF8"/>
    <circle cx="240" cy="360" r="2.5" fill="#38BDF8"/>
    <circle cx="400" cy="280" r="2.5" fill="#38BDF8"/>
    <circle cx="280" cy="220" r="2.5" fill="#38BDF8"/>
    <circle cx="220" cy="130" r="2.5" fill="#38BDF8"/>
    <circle cx="300" cy="90" r="2.5" fill="#38BDF8"/>
    <circle cx="220" cy="250" r="2.5" fill="#38BDF8"/>
    <circle cx="300" cy="210" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Technical Calibration / Contour Bar (Bottom Right) -->
  <g transform="translate(460, 360)">
    <text x="0" y="-8" fill="#94A3B8" font-family="monospace" font-size="9.5">VON MISES [MPa]</text>
    <rect x="0" y="0" width="130" height="12" fill="url(#stressGrad)" stroke="#334155" stroke-width="1"/>
    <text x="0" y="24" fill="#64748B" font-family="monospace" font-size="8.5">0.0</text>
    <text x="45" y="24" fill="#64748B" font-family="monospace" font-size="8.5">140</text>
    <text x="105" y="24" fill="#EF4444" font-family="monospace" font-size="8.5">280+</text>
  </g>

  <!-- Technical Parameters Box (Bottom Left) -->
  <g transform="translate(32, 380)">
    <rect x="0" y="0" width="220" height="58" rx="4" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="16" fill="#38BDF8" font-family="monospace" font-size="9">ELEMENT TYPE: C3D8R / HEX8</text>
    <text x="12" y="32" fill="#94A3B8" font-family="monospace" font-size="9">NONLINEAR CONTACT: ENFORCED</text>
    <text x="12" y="48" fill="#94A3B8" font-family="monospace" font-size="9">CONVERGENCE: FULL NEWTON-RAPHSON</text>
  </g>
</svg>
